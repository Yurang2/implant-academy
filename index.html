<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>링고 아카데미</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --ground:#F3F9F7; --card:#FFFFFF; --card2:#E9F3F0;
    --ink:#0F2E2A; --muted:#5E7A75; --faint:#9AB1AC;
    --accent:#0E8F84; --accent-deep:#0A6B62; --accent-soft:#D9EEEA;
    --mint:#2FC2B1;
    --gold:#F2B01E; --gold-deep:#C98E0F; --gold-soft:#FBEED0;
    --coral:#EF5B6B; --coral-deep:#C43D4D; --coral-soft:#FCE4E7;
    --good:#2FA96E; --good-deep:#1F8354; --good-soft:#DCF2E6;
    --line:#DCEAE6; --line2:#C8DCD7;
    --overlay:rgba(15,46,42,.45);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ground:#0B1917; --card:#132622; --card2:#0F211D;
      --ink:#E9F5F2; --muted:#9CB5B0; --faint:#63807A;
      --accent:#1FAF9F; --accent-deep:#0C7268; --accent-soft:#12403A;
      --mint:#2FC2B1;
      --gold:#F2B01E; --gold-deep:#A97A10; --gold-soft:#3A2F12;
      --coral:#F26B7A; --coral-deep:#A83D4A; --coral-soft:#3C1B21;
      --good:#37B877; --good-deep:#1E7B50; --good-soft:#123526;
      --line:#1F3833; --line2:#2A473F;
      --overlay:rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0B1917; --card:#132622; --card2:#0F211D;
    --ink:#E9F5F2; --muted:#9CB5B0; --faint:#63807A;
    --accent:#1FAF9F; --accent-deep:#0C7268; --accent-soft:#12403A;
    --mint:#2FC2B1;
    --gold:#F2B01E; --gold-deep:#A97A10; --gold-soft:#3A2F12;
    --coral:#F26B7A; --coral-deep:#A83D4A; --coral-soft:#3C1B21;
    --good:#37B877; --good-deep:#1E7B50; --good-soft:#123526;
    --line:#1F3833; --line2:#2A473F;
    --overlay:rgba(0,0,0,.55);
  }
  :root[data-theme="light"]{
    --ground:#F3F9F7; --card:#FFFFFF; --card2:#E9F3F0;
    --ink:#0F2E2A; --muted:#5E7A75; --faint:#9AB1AC;
    --accent:#0E8F84; --accent-deep:#0A6B62; --accent-soft:#D9EEEA;
    --mint:#2FC2B1;
    --gold:#F2B01E; --gold-deep:#C98E0F; --gold-soft:#FBEED0;
    --coral:#EF5B6B; --coral-deep:#C43D4D; --coral-soft:#FCE4E7;
    --good:#2FA96E; --good-deep:#1F8354; --good-soft:#DCF2E6;
    --line:#DCEAE6; --line2:#C8DCD7;
    --overlay:rgba(15,46,42,.45);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ground); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
    font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit; color:inherit;}
  :focus-visible{outline:3px solid var(--mint); outline-offset:2px; border-radius:8px;}

  #app{
    max-width:430px; margin:0 auto; min-height:100dvh;
    display:flex; flex-direction:column; position:relative;
  }
  @media (min-width:480px){
    #app{border-left:1px solid var(--line); border-right:1px solid var(--line);}
  }

  .screen{display:none; flex-direction:column; flex:1; min-height:100dvh;}
  .screen.active{display:flex;}

  /* ---------- shared buttons ---------- */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    border:0; border-radius:16px; cursor:pointer;
    padding:15px 22px; font-weight:800; font-size:17px; letter-spacing:.02em;
    transition:transform .06s ease, box-shadow .06s ease, filter .15s ease, opacity .15s ease;
    user-select:none; width:100%;
  }
  .btn.primary{background:var(--accent); color:#fff; box-shadow:0 4px 0 var(--accent-deep);}
  .btn.good{background:var(--good); color:#fff; box-shadow:0 4px 0 var(--good-deep);}
  .btn.bad{background:var(--coral); color:#fff; box-shadow:0 4px 0 var(--coral-deep);}
  .btn.gold{background:var(--gold); color:#4A3403; box-shadow:0 4px 0 var(--gold-deep);}
  .btn.ghost{background:var(--card); color:var(--accent); border:2px solid var(--line2); box-shadow:0 4px 0 var(--line2);}
  .btn:not(:disabled):active{transform:translateY(3px); box-shadow:0 1px 0 var(--accent-deep);}
  .btn.ghost:not(:disabled):active{box-shadow:0 1px 0 var(--line2);}
  .btn.good:not(:disabled):active{box-shadow:0 1px 0 var(--good-deep);}
  .btn.bad:not(:disabled):active{box-shadow:0 1px 0 var(--coral-deep);}
  .btn.gold:not(:disabled):active{box-shadow:0 1px 0 var(--gold-deep);}
  .btn:disabled{opacity:.45; cursor:default; filter:saturate(.4);}
  .icon{width:1.2em; height:1.2em; flex:none; display:inline-block; vertical-align:-0.2em;}

  /* ---------- onboarding ---------- */
  #s-onboard{justify-content:center; padding:32px 24px calc(32px + env(safe-area-inset-bottom));}
  .logo-badge{
    width:88px; height:88px; margin:0 auto 20px; border-radius:26px;
    background:linear-gradient(145deg, var(--mint), var(--accent));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 0 var(--accent-deep), 0 14px 30px rgba(14,143,132,.25);
  }
  .logo-badge svg{width:52px; height:52px; color:#fff;}
  .onboard-title{font-size:28px; font-weight:900; text-align:center; margin:0 0 6px; letter-spacing:-.02em; text-wrap:balance;}
  .onboard-sub{color:var(--muted); text-align:center; margin:0 0 28px; font-size:15px;}
  .name-label{font-size:13px; font-weight:800; color:var(--muted); letter-spacing:.08em; margin-bottom:8px; display:block;}
  #name-input{
    width:100%; padding:16px; border-radius:16px; border:2px solid var(--line2);
    background:var(--card); color:var(--ink);
    font-size:22px; font-weight:800; text-align:center; letter-spacing:.35em; text-indent:.35em;
  }
  #name-input:focus{border-color:var(--accent); outline:none;}
  #name-err{color:var(--coral); font-size:13.5px; font-weight:700; min-height:21px; margin:8px 2px 10px; text-align:center;}
  .returning{margin-top:26px;}
  .returning h3{font-size:13px; color:var(--faint); font-weight:800; letter-spacing:.08em; margin:0 0 10px; text-align:center;}
  .profile-chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center;}
  .pchip{
    display:flex; align-items:center; gap:8px; padding:9px 14px;
    background:var(--card); border:2px solid var(--line); border-radius:999px;
    font-weight:800; font-size:15px; cursor:pointer;
  }
  .pchip .xp{color:var(--gold-deep); font-size:12.5px; font-weight:800;}
  .pchip:active{transform:scale(.96);}

  /* ---------- home ---------- */
  #s-home{padding-bottom:40px;}
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:14px;
    padding:12px 16px calc(12px);
    padding-top:calc(12px + env(safe-area-inset-top));
    background:color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:8px; font-weight:900; font-size:16px; letter-spacing:-.01em; margin-right:auto;}
  .brand svg{width:22px; height:22px; color:var(--accent);}
  .stat{display:flex; align-items:center; gap:5px; font-weight:900; font-size:15px; font-variant-numeric:tabular-nums;}
  .stat svg{width:19px; height:19px;}
  .stat.streak{color:#E8862C;}
  .stat.streak.off{color:var(--faint);}
  .stat.xp{color:var(--gold-deep);}
  :root[data-theme="dark"] .stat.xp{color:var(--gold);}
  @media (prefers-color-scheme: dark){ .stat.xp{color:var(--gold);} :root[data-theme="light"] .stat.xp{color:var(--gold-deep);} }
  .avatar{
    width:36px; height:36px; border-radius:12px; border:2px solid var(--line2);
    background:var(--card); font-weight:900; font-size:15px; color:var(--accent);
    display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
  }

  .unit-banner{
    margin:22px 16px 6px; padding:16px 18px; border-radius:20px;
    background:linear-gradient(135deg, var(--accent), var(--accent-deep));
    color:#fff; box-shadow:0 5px 0 var(--accent-deep);
    position:relative; overflow:hidden;
  }
  .unit-banner.locked-banner{background:var(--card2); color:var(--muted); box-shadow:0 5px 0 var(--line);}
  .unit-banner .eyebrow{font-size:12px; font-weight:900; letter-spacing:.12em; opacity:.85; margin-bottom:2px;}
  .unit-banner h2{margin:0; font-size:19px; font-weight:900; letter-spacing:-.01em;}
  .unit-banner p{margin:4px 0 0; font-size:13.5px; opacity:.9;}
  .unit-banner .uprog{
    position:absolute; top:14px; right:16px; font-size:12.5px; font-weight:900;
    background:rgba(255,255,255,.2); border-radius:999px; padding:4px 10px;
    font-variant-numeric:tabular-nums;
  }
  .unit-banner.locked-banner .uprog{background:var(--line);}

  .nodes{display:flex; flex-direction:column; align-items:center; padding:30px 0 10px; gap:32px;}
  .node-slot{position:relative; height:76px; display:flex; align-items:center; justify-content:center;}
  .node{
    width:74px; height:74px; border-radius:50%; border:0; cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center; position:relative;
    transition:transform .08s ease;
  }
  .node svg{width:30px; height:30px;}
  .node:active{transform:scale(.94) translateX(var(--offx,0));}
  .node.done{background:var(--gold); color:#fff; box-shadow:0 6px 0 var(--gold-deep);}
  .node.current{background:var(--accent); color:#fff; box-shadow:0 6px 0 var(--accent-deep);}
  .node.locked{background:var(--card2); color:var(--faint); box-shadow:0 6px 0 var(--line); cursor:default;}
  .node .ring{
    position:absolute; inset:-9px; border-radius:50%;
    border:4px solid var(--accent); opacity:.35; pointer-events:none;
    animation:pulse 1.6s ease-out infinite;
  }
  @keyframes pulse{
    0%{transform:scale(.92); opacity:.4;}
    70%{transform:scale(1.12); opacity:0;}
    100%{transform:scale(1.12); opacity:0;}
  }
  .node .stars{
    position:absolute; bottom:-13px; left:50%; transform:translateX(-50%);
    display:flex; gap:1px; background:var(--card); border-radius:999px; padding:2px 6px;
    border:1.5px solid var(--line);
  }
  .node .stars svg{width:11px; height:11px; color:var(--gold);}
  .node .stars svg.dim{color:var(--line2);}
  .start-tip{
    position:absolute; bottom:calc(100% + 12px); left:50%; transform:translateX(-50%);
    background:var(--card); color:var(--accent);
    font-weight:900; font-size:13px; letter-spacing:.06em;
    padding:7px 14px; border-radius:12px; border:2px solid var(--line2);
    animation:bob 1.4s ease-in-out infinite; white-space:nowrap; z-index:5; pointer-events:none;
  }
  .start-tip::after{
    content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:7px solid transparent; border-top-color:var(--line2);
  }
  @keyframes bob{0%,100%{transform:translate(-50%,0);}50%{transform:translate(-50%,-6px);}}
  .node-label{
    position:absolute; top:50%; transform:translateY(-50%);
    font-size:12.5px; font-weight:800; color:var(--muted); width:118px; line-height:1.3;
  }
  .finish-card{
    margin:28px 16px 10px; padding:24px 18px; text-align:center;
    background:linear-gradient(135deg, var(--gold), #E89A0C); color:#4A3403;
    border-radius:20px; box-shadow:0 5px 0 var(--gold-deep);
    font-weight:900; font-size:17px;
  }
  .finish-card .big{font-size:34px; display:block; margin-bottom:4px;}

  /* ---------- lesson ---------- */
  #s-lesson{background:var(--ground);}
  .lesson-top{
    display:flex; align-items:center; gap:12px;
    padding:14px 16px 10px; padding-top:calc(14px + env(safe-area-inset-top));
  }
  .quit-btn{
    background:none; border:0; cursor:pointer; color:var(--faint);
    font-size:22px; font-weight:800; padding:4px 8px; line-height:1;
  }
  .pbar{flex:1; height:14px; border-radius:999px; background:var(--card2); overflow:hidden;}
  .pbar-fill{
    height:100%; width:0%; border-radius:999px;
    background:linear-gradient(90deg, var(--mint), var(--accent));
    transition:width .4s cubic-bezier(.22,1,.36,1);
    position:relative;
  }
  .hearts{display:flex; align-items:center; gap:4px; color:var(--coral); font-weight:900; font-size:15px; font-variant-numeric:tabular-nums;}
  .hearts svg{width:20px; height:20px;}

  .q-wrap{flex:1; overflow-y:auto; padding:10px 20px 20px; display:flex; flex-direction:column;}
  .q-kind{font-size:12.5px; font-weight:900; letter-spacing:.1em; color:var(--accent); margin:8px 0 6px;}
  .q-prompt{font-size:20px; font-weight:800; line-height:1.45; margin:0 0 22px; letter-spacing:-.01em; text-wrap:balance;}
  .q-prompt .blank-slot{
    display:inline-block; min-width:86px; border-bottom:3px solid var(--line2);
    text-align:center; color:var(--accent); font-weight:900; padding:0 6px; line-height:1.2;
  }
  .q-prompt .blank-slot.filled{border-bottom-color:var(--accent);}

  .opts{display:flex; flex-direction:column; gap:11px;}
  .opt{
    background:var(--card); border:2px solid var(--line2); border-radius:16px;
    box-shadow:0 4px 0 var(--line2); padding:14px 16px; text-align:left;
    font-size:16.5px; font-weight:700; cursor:pointer; line-height:1.4;
    transition:transform .06s ease, background .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .opt:not(:disabled):active{transform:translateY(2px); box-shadow:0 2px 0 var(--line2);}
  .opt.sel{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 4px 0 var(--accent-deep); color:var(--ink);}
  .opt.good{border-color:var(--good); background:var(--good-soft); box-shadow:0 4px 0 var(--good-deep);}
  .opt.bad{border-color:var(--coral); background:var(--coral-soft); box-shadow:0 4px 0 var(--coral-deep);}
  .opt:disabled{cursor:default;}
  .opt.faded{opacity:.5;}

  .ox-row{display:flex; gap:12px;}
  .ox-row .opt{flex:1; text-align:center; padding:22px 10px;}
  .ox-glyph{display:block; font-size:34px; font-weight:900; line-height:1; margin-bottom:6px;}
  .ox-o .ox-glyph{color:var(--accent);}
  .ox-x .ox-glyph{color:var(--coral);}

  .chips{display:flex; flex-wrap:wrap; gap:10px;}
  .chip{
    background:var(--card); border:2px solid var(--line2); border-radius:14px;
    box-shadow:0 3px 0 var(--line2); padding:10px 16px;
    font-size:16px; font-weight:800; cursor:pointer;
    transition:transform .06s ease, opacity .12s ease;
  }
  .chip:not(:disabled):active{transform:translateY(2px);}
  .chip.used{opacity:.35; pointer-events:none;}
  .chip.sel{border-color:var(--accent); background:var(--accent-soft);}

  .order-area{
    min-height:64px; border:2px dashed var(--line2); border-radius:16px;
    padding:10px; display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;
    align-content:flex-start; background:var(--card2);
  }
  .order-area .chip{display:flex; align-items:center; gap:7px;}
  .order-area .chip .num{
    width:20px; height:20px; border-radius:50%; background:var(--accent); color:#fff;
    font-size:12px; font-weight:900; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .order-hint{font-size:13px; color:var(--faint); font-weight:700; margin:0 0 8px;}

  .match-grid{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
  .match-grid .opt{text-align:center; padding:15px 10px; font-size:15.5px;}
  .opt.matched{opacity:.35; border-color:var(--good); background:var(--good-soft); box-shadow:0 4px 0 var(--good-deep); pointer-events:none;}
  .opt.shake{animation:shake .35s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);}
  }

  .check-bar{
    padding:14px 20px calc(16px + env(safe-area-inset-bottom));
    border-top:2px solid var(--line); background:var(--ground);
  }

  .feedback{
    position:fixed; bottom:0; left:50%; transform:translate(-50%,105%);
    width:100%; max-width:430px; z-index:40;
    border-radius:24px 24px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    transition:transform .28s cubic-bezier(.22,1,.36,1);
    box-shadow:0 -8px 30px rgba(0,0,0,.12);
  }
  .feedback.show{transform:translate(-50%,0);}
  .feedback.good-fb{background:var(--good-soft);}
  .feedback.bad-fb{background:var(--coral-soft);}
  .fb-head{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .fb-icon{
    width:34px; height:34px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .good-fb .fb-icon{background:var(--good);}
  .bad-fb .fb-icon{background:var(--coral);}
  .fb-icon svg{width:20px; height:20px;}
  .fb-title{font-size:19px; font-weight:900; letter-spacing:-.01em;}
  .good-fb .fb-title{color:var(--good-deep);}
  .bad-fb .fb-title{color:var(--coral-deep);}
  @media (prefers-color-scheme: dark){
    .good-fb .fb-title{color:var(--good);}
    .bad-fb .fb-title{color:var(--coral);}
  }
  :root[data-theme="dark"] .good-fb .fb-title{color:var(--good);}
  :root[data-theme="dark"] .bad-fb .fb-title{color:var(--coral);}
  :root[data-theme="light"] .good-fb .fb-title{color:var(--good-deep);}
  :root[data-theme="light"] .bad-fb .fb-title{color:var(--coral-deep);}
  .fb-answer{font-weight:800; font-size:14.5px; margin:0 0 4px;}
  .fb-heard{font-weight:800; font-size:16px; margin:0 0 8px; line-height:1.5;}
  .fb-heard .hit{color:var(--good-deep);}
  .fb-heard .miss{color:var(--coral-deep); text-decoration:underline; text-decoration-style:wavy; text-underline-offset:3px;}
  :root[data-theme="dark"] .fb-heard .hit{color:var(--good);}
  :root[data-theme="dark"] .fb-heard .miss{color:var(--coral);}
  @media (prefers-color-scheme: dark){
    .fb-heard .hit{color:var(--good);} .fb-heard .miss{color:var(--coral);}
    :root[data-theme="light"] .fb-heard .hit{color:var(--good-deep);}
    :root[data-theme="light"] .fb-heard .miss{color:var(--coral-deep);}
  }
  .fb-expl{font-size:14.5px; line-height:1.55; margin:0 0 16px; color:var(--ink);}

  /* ---------- result ---------- */
  #s-result{justify-content:center; padding:32px 24px calc(32px + env(safe-area-inset-bottom)); position:relative; text-align:center;}
  #confetti{position:absolute; inset:0; pointer-events:none;}
  .result-emblem{
    width:104px; height:104px; margin:0 auto 18px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; position:relative; z-index:2;
  }
  .result-emblem.win{background:var(--gold-soft); color:var(--gold);}
  .result-emblem.lose{background:var(--coral-soft); color:var(--coral);}
  .result-emblem svg{width:56px; height:56px;}
  .result-title{font-size:26px; font-weight:900; margin:0 0 4px; letter-spacing:-.02em; position:relative; z-index:2;}
  .result-sub{color:var(--muted); margin:0 0 24px; font-size:15px; position:relative; z-index:2;}
  .result-stats{display:flex; gap:10px; margin-bottom:26px; position:relative; z-index:2;}
  .rstat{
    flex:1; background:var(--card); border:2px solid var(--line); border-radius:18px;
    padding:14px 8px 12px;
  }
  .rstat .lab{font-size:11.5px; font-weight:900; letter-spacing:.1em; color:var(--faint); margin-bottom:3px;}
  .rstat .val{font-size:21px; font-weight:900; font-variant-numeric:tabular-nums; display:flex; align-items:center; justify-content:center; gap:5px;}
  .rstat .val svg{width:19px; height:19px;}
  .rstat.v-xp .val{color:var(--gold-deep);}
  .rstat.v-acc .val{color:var(--accent);}
  .rstat.v-streak .val{color:#E8862C;}
  .result-actions{display:flex; flex-direction:column; gap:10px; position:relative; z-index:2;}
  .result-stars{display:flex; justify-content:center; gap:6px; margin-bottom:18px; position:relative; z-index:2;}
  .result-stars svg{width:40px; height:40px; color:var(--gold);}
  .result-stars svg.dim{color:var(--line2);}

  /* ---------- modal ---------- */
  .modal-veil{
    position:fixed; inset:0; background:var(--overlay); z-index:60;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; transition:opacity .2s ease;
  }
  .modal-veil.show{opacity:1;}
  .modal{
    width:100%; max-width:430px; background:var(--card);
    border-radius:24px 24px 0 0; padding:24px 20px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(30px); transition:transform .25s cubic-bezier(.22,1,.36,1);
  }
  .modal-veil.show .modal{transform:translateY(0);}
  .modal h3{margin:0 0 4px; font-size:20px; font-weight:900; letter-spacing:-.01em;}
  .modal .msub{color:var(--muted); font-size:14px; margin:0 0 18px;}
  .modal-actions{display:flex; flex-direction:column; gap:10px; margin-top:18px;}
  .stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .sg-item{background:var(--card2); border-radius:14px; padding:12px 14px;}
  .sg-item .lab{font-size:11.5px; font-weight:900; letter-spacing:.08em; color:var(--faint);}
  .sg-item .val{font-size:19px; font-weight:900; font-variant-numeric:tabular-nums;}
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 2px; border-bottom:1px solid var(--line); font-weight:800; font-size:15.5px;
  }
  .switch{
    width:52px; height:30px; border-radius:999px; border:0; cursor:pointer;
    background:var(--line2); position:relative; transition:background .15s ease; padding:0;
  }
  .switch::after{
    content:""; position:absolute; top:3px; left:3px; width:24px; height:24px;
    border-radius:50%; background:#fff; transition:transform .15s ease;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .switch.on{background:var(--accent);}
  .switch.on::after{transform:translateX(22px);}

  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(8px);
    background:var(--ink); color:var(--ground);
    font-size:14px; font-weight:800; padding:10px 18px; border-radius:999px;
    opacity:0; transition:opacity .2s ease, transform .2s ease; z-index:80; pointer-events:none;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001s !important; transition-duration:.001s !important;}
  }

  /* ---------- 트랙 ---------- */
  .track-row{display:flex; gap:8px; padding:12px 16px 0; overflow-x:auto; scrollbar-width:none;}
  .track-row::-webkit-scrollbar{display:none;}
  .track-chip{
    flex:none; display:flex; align-items:center; gap:6px; padding:8px 14px;
    border-radius:999px; border:2px solid var(--line2); background:var(--card);
    font-weight:800; font-size:14px; cursor:pointer; white-space:nowrap;
  }
  .track-chip.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-deep);}
  .track-chip svg{width:16px; height:16px;}
  :root[data-theme="dark"] .track-chip.on{color:var(--ink);}
  @media (prefers-color-scheme: dark){ .track-chip.on{color:var(--ink);} }
  .track-locked{
    margin:26px 16px 0; padding:16px 18px; border-radius:20px;
    background:var(--card2); border:2px dashed var(--line2); color:var(--muted);
  }
  .track-locked .tl-head{display:flex; align-items:center; gap:8px; font-weight:900; font-size:15px; color:var(--ink);}
  .track-locked .tl-head svg{width:17px; height:17px; color:var(--faint);}
  .track-locked p{margin:6px 0 0; font-size:13px; line-height:1.55;}

  /* ---------- 듣기 ---------- */
  .audio-hero{display:flex; align-items:center; gap:12px; margin:2px 0 22px;}
  .audio-btn{
    width:88px; height:88px; flex:none; border:0; border-radius:26px; cursor:pointer; padding:0;
    background:linear-gradient(145deg, var(--mint), var(--accent)); color:#fff;
    box-shadow:0 5px 0 var(--accent-deep);
    display:flex; align-items:center; justify-content:center;
    transition:transform .07s ease;
  }
  .audio-btn svg{width:40px; height:40px;}
  .audio-btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--accent-deep);}
  .audio-btn.playing{animation:sound 1s ease-in-out infinite;}
  @keyframes sound{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
  .audio-slow{
    display:flex; align-items:center; gap:7px; padding:12px 16px;
    background:var(--card); border:2px solid var(--line2); border-radius:16px;
    box-shadow:0 3px 0 var(--line2); font-weight:800; font-size:14.5px;
    color:var(--muted); cursor:pointer;
  }
  .audio-slow svg{width:20px; height:20px;}
  .audio-slow:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line2);}
  .no-tts{
    background:var(--gold-soft); color:var(--gold-deep); border-radius:14px;
    padding:11px 14px; font-size:13.5px; font-weight:800; margin:0 0 16px; line-height:1.5;
  }
  :root[data-theme="dark"] .no-tts{color:var(--gold);}
  @media (prefers-color-scheme: dark){ .no-tts{color:var(--gold);} }
  .tts-mini{
    background:none; border:0; cursor:pointer; color:var(--accent); padding:2px 4px;
    vertical-align:-.22em; line-height:1;
  }
  .tts-mini svg{width:20px; height:20px;}
  .tts-mini:active{transform:scale(.9);}

  /* ---------- 말하기 ---------- */
  .speak-card{
    background:var(--card); border:2px solid var(--line); border-radius:20px;
    padding:18px 18px 16px; margin-bottom:20px;
  }
  .speak-en{
    margin:0 0 8px; font-size:21px; font-weight:800; line-height:1.4;
    letter-spacing:-.01em; text-wrap:balance;
  }
  .speak-ko{margin:0; font-size:14.5px; color:var(--muted); font-weight:700;}
  .mic-wrap{display:flex; flex-direction:column; align-items:center; gap:12px; margin-top:auto; padding:12px 0 4px;}
  .mic-btn{
    width:96px; height:96px; border-radius:50%; border:0; cursor:pointer; padding:0;
    background:var(--accent); color:#fff; box-shadow:0 6px 0 var(--accent-deep);
    display:flex; align-items:center; justify-content:center; position:relative;
    transition:transform .07s ease;
  }
  .mic-btn svg{width:42px; height:42px;}
  .mic-btn:active{transform:translateY(3px); box-shadow:0 3px 0 var(--accent-deep);}
  .mic-btn.recording{background:var(--coral); box-shadow:0 6px 0 var(--coral-deep);}
  .mic-btn.recording::before{
    content:""; position:absolute; inset:-12px; border-radius:50%;
    border:4px solid var(--coral); opacity:.4; animation:pulse 1.3s ease-out infinite;
  }
  .mic-btn:disabled{background:var(--line2); box-shadow:0 6px 0 var(--line); cursor:default;}
  .mic-hint{margin:0; font-size:13.5px; font-weight:800; color:var(--muted); text-align:center;}
  .heard{
    margin:0; min-height:24px; font-size:16px; font-weight:800; text-align:center;
    color:var(--accent); line-height:1.4;
  }
  .heard .miss{color:var(--coral); text-decoration:underline; text-decoration-style:wavy; text-underline-offset:3px;}
  .heard .hit{color:var(--good);}
  .score-ring{
    font-size:13px; font-weight:900; color:var(--muted); font-variant-numeric:tabular-nums;
  }
  .speak-skip{
    background:none; border:0; cursor:pointer; color:var(--faint);
    font-size:13.5px; font-weight:800; text-decoration:underline; padding:8px;
  }

  /* ---------- 문장 만들기 ---------- */
  .wb-area{
    min-height:112px; padding:8px 4px; margin-bottom:20px;
    display:flex; flex-direction:column; gap:0;
  }
  .wb-line{
    min-height:52px; border-bottom:2px solid var(--line2);
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:6px 2px;
  }
  .wb-area .chip{box-shadow:0 3px 0 var(--line2);}
  .wb-bank{display:flex; flex-wrap:wrap; gap:10px; min-height:52px;}
  .wb-bank .chip.ghosted{
    background:transparent; border-color:var(--line); box-shadow:none;
    color:transparent; pointer-events:none;
  }
  .q-hint{
    font-size:14px; color:var(--muted); font-weight:700; margin:-14px 0 20px;
  }
  .q-en{
    font-size:20px; font-weight:800; line-height:1.45; margin:0 0 8px;
    letter-spacing:-.01em; text-wrap:balance;
  }
</style>

const TTS = !!window.speechSynthesis;
let voices = [];
function loadVoices(){ if(TTS) voices = window.speechSynthesis.getVoices() || []; }
if(TTS){ loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(lang){
  if(!voices.length) return null;
  const base = lang.slice(0,2).toLowerCase();
  return voices.find(v => (v.lang||'').replace('_','-').toLowerCase() === lang.toLowerCase())
      || voices.find(v => (v.lang||'').toLowerCase().startsWith(base))
      || null;
}
function say(text, opts){
  if(!TTS || !text) return false;
  const o = opts || {};
  try{
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = track.lang || 'en-US';
    const v = pickVoice(utt.lang); if(v) utt.voice = v;
    utt.rate = o.slow ? 0.6 : 0.94;
    utt.pitch = 1;
    if(o.onend) utt.onend = o.onend;
    window.speechSynthesis.speak(utt);
    return true;
  }catch(e){ return false; }
}

/* ================= 음성 인식(STT) ================= */
const SRClass = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const STT = !!SRClass;
let rec = null;
function startRecognition(onResult, onError){
  if(!STT) { onError('unsupported'); return null; }
  try{
    rec = new SRClass();
    rec.lang = track.lang || 'en-US';
    rec.interimResults = false;
    rec.maxAlternatives = 3;
    rec.continuous = false;
    rec.onresult = (e) => {
      const alts = [];
      for(let i=0;i<e.results[0].length;i++) alts.push(e.results[0][i].transcript);
      onResult(alts);
    };
    rec.onerror = (e) => onError(e.error || 'error');
    rec.start();
    return rec;
  }catch(e){ onError('error'); return null; }
}
function stopRecognition(){ if(rec) try{ rec.stop(); }catch(e){} rec = null; }

/* ================= 발음 채점 ================= */
const CONTRACTIONS = [
  [/\bi'm\b/g,'i am'], [/\bwon't\b/g,'will not'], [/\bcan't\b/g,'can not'],
  [/n't\b/g,' not'], [/'re\b/g,' are'], [/'ll\b/g,' will'],
  [/'ve\b/g,' have'], [/'d\b/g,' would'], [/\blet's\b/g,'let us'],
  [/\bit's\b/g,'it is'], [/\bthat's\b/g,'that is'], [/\bwhat's\b/g,'what is'],
  [/\bhe's\b/g,'he is'], [/\bshe's\b/g,'she is'], [/\bwhere's\b/g,'where is'],
];
function norm(s){
  let t = String(s||'').toLowerCase();
  CONTRACTIONS.forEach(([re, to]) => { t = t.replace(re, to); });
  return t.replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
const words = (s) => norm(s).split(' ').filter(Boolean);

// 목표 문장의 단어가 몇 개나 들렸는지 (순서 무시, 중복 1회씩)
function scoreSpeech(target, heard){
  const tw = words(target), hw = words(heard);
  if(!tw.length) return { ratio:0, hits:[] };
  const pool = [...hw];
  const hits = tw.map(w => {
    const i = pool.indexOf(w);
    if(i >= 0){ pool.splice(i,1); return true; }
    return false;
  });
  return { ratio: hits.filter(Boolean).length / tw.length, hits };
}
const SPEAK_PASS = 0.7;

/* ================= 사운드 ================= */
let actx = null;
function tone(freq, t0, dur, type, vol){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, actx.currentTime + t0);
  g.gain.linearRampToValueAtTime(vol || .14, actx.currentTime + t0 + .015);
  g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(actx.currentTime + t0); o.stop(actx.currentTime + t0 + dur + .05);
}
function play(kind){
  if(!userName || me().sound === false) return;
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    if(kind === 'good'){ tone(660, 0, .12); tone(880, .1, .18); }
    else if(kind === 'bad'){ tone(196, 0, .22, 'triangle', .12); }
    else if(kind === 'win'){ [523,659,784,1047].forEach((f,i)=>tone(f, i*.11, .2)); }
    else if(kind === 'tap'){ tone(520, 0, .05, 'sine', .05); }
  }catch(e){}
}

function startLesson(gi, review){
  const lesson = LESSONS[gi];
  S = {
    gi, lesson, review,
    queue: lesson.questions.map(q => ({ q, first:true })),
    total: lesson.questions.length,
    firstCorrect: 0, solved: 0, xp: 0,

}

// 문항의 "정답 영어 문장" — 자동 듣기 / 해설 재생에 사용
function targetSentence(q){
  if(q.type === 'listen') return q.audio;
  if(q.type === 'speak') return q.text;
  if(q.type === 'wordbank') return q.answer;
  return null;
}

function nextQuestion(){
  stopSay(); stopRecognition();
  S.cur = S.queue.shift();
  S.sel = null; S.built = []; S.matchState = null; S.locked = false;
  const q = S.cur.q;
  const wrap = $('#q-wrap');
  const kind = '<div class="q-kind">' + (KIND_LABEL[q.type] || '') + '</div>';
  const checkBar = $('#check-bar');
  checkBar.style.display = '';
  const btn = $('#btn-check');
  btn.disabled = true;
  btn.textContent = '확인';

  if(q.type === 'listen'){
    wrap.innerHTML = kind + '<h2 class="q-prompt">무엇이 들렸나요?</h2>'
      + (TTS ? '' : '<p class="no-tts">이 브라우저는 음성 재생을 지원하지 않아 문장을 글로 보여 드려요.<br><b>'+esc(q.audio)+'</b></p>')
      + (TTS ? '<div class="audio-hero">'
          + '<button class="audio-btn" id="btn-audio" aria-label="문장 듣기">'+IC.speaker.replace('class="icon"','')+'</button>'
          + '<button class="audio-slow" id="btn-audio-slow">'+IC.turtle+' 천천히</button>'
          + '</div>' : '')
      + '<div class="opts">' + shuffle(q.options.map((o,i)=>i)).map(i=>'<button class="opt" data-i="'+i+'">'+esc(q.options[i])+'</button>').join('') + '</div>';
    if(TTS){
      const ab = $('#btn-audio');
      const playAudio = (slow) => {
        ab.classList.add('playing');
        say(q.audio, { slow: slow, onend: ()=>ab.classList.remove('playing') });
        setTimeout(()=>ab.classList.remove('playing'), 4000);
      };
      ab.addEventListener('click', ()=>playAudio(false));
      $('#btn-audio-slow').addEventListener('click', ()=>playAudio(true));
      setTimeout(()=>playAudio(false), 260);
    }
    wrap.querySelectorAll('.opt').forEach(b => b.addEventListener('click', ()=>{
      if(S.locked) return;
      wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); S.sel = +b.dataset.i; btn.disabled = false; play('tap');
    }));
  }
  else if(q.type === 'speak'){
    checkBar.style.display = 'none';
    const canMic = STT && me().mic !== false;
    wrap.innerHTML = kind
      + '<div class="speak-card">'
      + '<p class="speak-en">'+esc(q.text)+' <button class="tts-mini" id="tts-say" aria-label="문장 듣기">'+IC.speaker+'</button></p>'
      + '<p class="speak-ko">'+esc(q.meaning||'')+'</p>'
      + '</div>'
      + '<div class="mic-wrap">'
      + '<button class="mic-btn" id="btn-mic" aria-label="말하기">'+IC.mic.replace('class="icon"','')+'</button>'
      + '<p class="mic-hint" id="mic-hint">'+(canMic ? '버튼을 누르고 문장을 말해 보세요' : '음성 인식을 쓸 수 없어요. 소리 내어 읽고 아래를 눌러 주세요.')+'</p>'
      + '<p class="heard" id="heard"></p>'
      + '<button class="speak-skip" id="btn-speak-skip">'+(canMic ? '지금은 말하기 어려워요' : '읽었어요, 넘어가기')+'</button>'
      + '</div>';
    $('#tts-say').addEventListener('click', ()=>say(q.text));
    if(TTS) setTimeout(()=>say(q.text), 280);
    const mic = $('#btn-mic');
    if(!canMic){ mic.disabled = true; }
    mic.addEventListener('click', ()=>{
      if(S.locked || !canMic) return;
      if(mic.classList.contains('recording')){ stopRecognition(); return; }
      stopSay();
      mic.classList.add('recording');
      $('#mic-hint').textContent = '듣고 있어요… 다 말하면 버튼을 눌러 주세요';
      $('#heard').innerHTML = '';
      startRecognition(
        (alts) => {
          mic.classList.remove('recording');
          let best = { ratio:-1, hits:[], text:'' };
          alts.forEach(a => {
            const s = scoreSpeech(q.text, a);
            if(s.ratio > best.ratio) best = { ratio:s.ratio, hits:s.hits, text:a };
          });
          const tw = words(q.text);
          $('#heard').innerHTML = tw.map((w,i)=>'<span class="'+(best.hits[i]?'hit':'miss')+'">'+esc(w)+'</span>').join(' ');
          $('#mic-hint').innerHTML = '<span class="score-ring">정확도 '+Math.round(best.ratio*100)+'%</span>';
          S.speakScores.push(best.ratio);
          const ok = best.ratio >= SPEAK_PASS;
          setTimeout(()=>resolveAnswer(ok, null, { speak:true, ratio:best.ratio, hits:best.hits, target:q.text }), 500);
        },
        (err) => {
          mic.classList.remove('recording');
          const hint = $('#mic-hint');
          if(err === 'no-speech') hint.textContent = '소리가 잡히지 않았어요. 다시 눌러 보세요.';
          else if(err === 'not-allowed' || err === 'service-not-allowed') hint.textContent = '마이크 권한이 필요해요. 프로필에서 마이크를 끌 수도 있어요.';
          else if(err === 'audio-capture') hint.textContent = '마이크를 찾지 못했어요. 연결을 확인해 주세요.';
          else if(err === 'network' || err === 'unsupported'){
            hint.textContent = '이 브라우저에서는 음성 인식을 쓸 수 없어요. 소리 내어 읽고 아래를 눌러 주세요.';
            mic.disabled = true;
            $('#btn-speak-skip').textContent = '읽었어요, 넘어가기';
          }
          else hint.textContent = '인식하지 못했어요. 다시 시도해 보세요.';
        }
      );
      play('tap');
    });
    $('#btn-speak-skip').addEventListener('click', ()=>{
      if(S.locked) return;
      stopRecognition();
      resolveAnswer(true, null, { speak:true, skipped:true });
    });
  }
  else if(q.type === 'wordbank'){
    const tiles = shuffle(q.answer.split(' ').concat(q.extra || []));
    wrap.innerHTML = kind + '<h2 class="q-prompt">'+esc(q.prompt)+'</h2>'
      + '<p class="order-hint">단어를 눌러 문장을 만들어 보세요.</p>'
      + '<div class="wb-area"><div class="wb-line" id="wb-line"></div><div class="wb-line"></div></div>'
      + '<div class="wb-bank" id="wb-bank">' + tiles.map((w,i)=>'<button class="chip" data-i="'+i+'" data-w="'+esc(w)+'">'+esc(w)+'</button>').join('') + '</div>';
    const line = $('#wb-line');
    const renderLine = () => {
      line.innerHTML = S.built.map((t,i)=>'<button class="chip" data-b="'+i+'">'+esc(t.w)+'</button>').join('');
      line.querySelectorAll('.chip').forEach(b => b.addEventListener('click', ()=>{
        if(S.locked) return;
        const t = S.built.splice(+b.dataset.b, 1)[0];
        const src = wrap.querySelector('#wb-bank .chip[data-i="'+t.i+'"]');
        if(src) src.classList.remove('ghosted');
        renderLine();
        btn.disabled = S.built.length === 0; play('tap');
      }));
    };
    wrap.querySelectorAll('#wb-bank .chip').forEach(b => b.addEventListener('click', ()=>{
      if(S.locked || b.classList.contains('ghosted')) return;
      b.classList.add('ghosted');
      S.built.push({ w: b.dataset.w, i: +b.dataset.i });
      renderLine();
      btn.disabled = S.built.length === 0; play('tap');
    }));
  }
  else if(q.type === 'choice'){
    wrap.innerHTML = kind + '<h2 class="q-prompt">'+esc(q.prompt)+'</h2>'
      + '<div class="opts">' + shuffle(q.options.map((o,i)=>i)).map(i=>'<button class="opt" data-i="'+i+'">'+esc(q.options[i])+'</button>').join('') + '</div>';
    wrap.querySelectorAll('.opt').forEach(b => b.addEventListener('click', ()=>{
      if(S.locked) return;
      wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); S.sel = +b.dataset.i; btn.disabled = false; play('tap');
    }));
  }
  else if(q.type === 'ox'){
    wrap.innerHTML = kind + '<h2 class="q-prompt">'+esc(q.prompt)+'</h2>'
      + '<div class="ox-row">'
      + '<button class="opt ox-o" data-v="true"><span class="ox-glyph">O</span>맞아요</button>'
      + '<button class="opt ox-x" data-v="false"><span class="ox-glyph">X</span>아니에요</button>'
      + '</div>';
    wrap.querySelectorAll('.opt').forEach(b => b.addEventListener('click', ()=>{
      if(S.locked) return;
      wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); S.sel = b.dataset.v === 'true'; btn.disabled = false; play('tap');
    }));
  }
  else if(q.type === 'blank'){
    const parts = q.prompt.split('___');
    const pHtml = esc(parts[0]) + '<span class="blank-slot" id="blank-slot">&nbsp;</span>' + esc(parts.slice(1).join('___'));
    wrap.innerHTML = kind + '<h2 class="q-prompt">'+pHtml+'</h2>'
      + (q.hint ? '<p class="q-hint">'+esc(q.hint)+'</p>' : '')
      + '<div class="chips">' + shuffle(q.options.map((o,i)=>i)).map(i=>'<button class="chip" data-i="'+i+'">'+esc(q.options[i])+'</button>').join('') + '</div>';
    wrap.querySelectorAll('.chip').forEach(b => b.addEventListener('click', ()=>{
      if(S.locked) return;
      wrap.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); S.sel = +b.dataset.i;
      const slot = $('#blank-slot');
      slot.textContent = q.options[S.sel]; slot.classList.add('filled');
      btn.disabled = false; play('tap');
    }));
  }
  else if(q.type === 'order'){
    let bank = shuffle(q.sequence);
    for(let t = 0; t < 8 && bank.join('|') === q.sequence.join('|') && q.sequence.length > 1; t++) bank = shuffle(q.sequence);
    wrap.innerHTML = kind + '<h2 class="q-prompt">'+esc(q.prompt)+'</h2>'
      + '<p class="order-hint">아래 카드를 순서대로 눌러 배치하세요. 배치한 카드를 누르면 취소됩니다.</p>'
      + '<div class="order-area" id="order-area"></div>'
      + '<div class="chips" id="order-bank">' + bank.map(o=>'<button class="chip" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('') + '</div>';
    const area = $('#order-area');
    const renderArea = () => {
      area.innerHTML = S.built.map((v,i)=>'<button class="chip" data-i="'+i+'"><span class="num">'+(i+1)+'</span>'+esc(v)+'</button>').join('');
      area.querySelectorAll('.chip').forEach(b => b.addEventListener('click', ()=>{
        if(S.locked) return;
        const v = S.built.splice(+b.dataset.i,1)[0];
        const bankBtn = [...wrap.querySelectorAll('#order-bank .chip')].find(x => x.dataset.v === v && x.classList.contains('used'));
        if(bankBtn) bankBtn.classList.remove('used');
        renderArea(); btn.disabled = true; play('tap');
      }));
    };
    wrap.querySelectorAll('#order-bank .chip').forEach(b => b.addEventListener('click', ()=>{
      if(S.locked || b.classList.contains('used')) return;
      b.classList.add('used'); S.built.push(b.dataset.v); renderArea();
      btn.disabled = S.built.length !== q.sequence.length; play('tap');
    }));
  }
  else if(q.type === 'match'){
    const left = shuffle(q.pairs.map(p=>p[0]));
    const right = shuffle(q.pairs.map(p=>p[1]));
    S.matchState = { selL:null, selR:null, matched:0, miss:0 };
    checkBar.style.display = 'none';
    wrap.innerHTML = kind + '<h2 class="q-prompt">'+esc(q.prompt||'뜻이 맞는 것끼리 짝을 지어 보세요.')+'</h2>'
      + '<div class="match-grid">'
      + left.map(v=>'<button class="opt mL" data-v="'+esc(v)+'">'+esc(v)+'</button>').join('')
      + right.map(v=>'<button class="opt mR" data-v="'+esc(v)+'">'+esc(v)+'</button>').join('')
      + '</div>';
    const grid = wrap.querySelector('.match-grid');
    const Ls = [...grid.querySelectorAll('.mL')], Rs = [...grid.querySelectorAll('.mR')];
    grid.innerHTML = '';
    for(let i=0;i<Ls.length;i++){ grid.appendChild(Ls[i]); grid.appendChild(Rs[i]); }
    const ms = S.matchState;
    const tryResolve = () => {
      if(ms.selL == null || ms.selR == null) return;
      const okPair = q.pairs.some(p => p[0] === ms.selL.dataset.v && p[1] === ms.selR.dataset.v);
      const a = ms.selL, b = ms.selR;
      ms.selL = null; ms.selR = null;
      if(okPair){
        a.classList.remove('sel'); b.classList.remove('sel');
        a.classList.add('matched'); b.classList.add('matched');
        ms.matched++; play('tap');
        say(a.dataset.v);
        if(ms.matched === q.pairs.length){
          setTimeout(()=>{
            const first = ms.miss === 0;
            resolveAnswer(first, first ? null : '헷갈린 짝이 있었어요. 해설을 확인해 보세요.');
          }, 350);
        }
      } else {
        ms.miss++;
        a.classList.add('shake','bad'); b.classList.add('shake','bad'); play('bad');
        setTimeout(()=>{ a.classList.remove('shake','bad','sel'); b.classList.remove('shake','bad','sel'); }, 420);
      }
    };
    grid.querySelectorAll('.opt').forEach(el => el.addEventListener('click', ()=>{
      if(S.locked || el.classList.contains('matched')) return;
      const isL = el.classList.contains('mL');
      const key = isL ? 'selL' : 'selR';
      if(ms[key] === el){ el.classList.remove('sel'); ms[key] = null; return; }
      if(ms[key]) ms[key].classList.remove('sel');
      ms[key] = el; el.classList.add('sel'); play('tap');
      tryResolve();
    }));
  }
  wrap.scrollTop = 0;
}

function checkAnswer(){
  const q = S.cur.q;
  let ok = false, answerText = '';
  if(q.type === 'choice' || q.type === 'blank' || q.type === 'listen'){
    ok = S.sel === q.answerIndex;
    answerText = q.options[q.answerIndex];
    const wrap = $('#q-wrap');
    wrap.querySelectorAll(q.type === 'blank' ? '.chip' : '.opt').forEach(b => {
      const i = +b.dataset.i;
      if(i === q.answerIndex) b.classList.add('good');
      else if(i === S.sel && !ok) b.classList.add('bad');
      else b.classList.add('faded');
      b.disabled = true;
    });
  }
  else if(q.type === 'ox'){
    ok = S.sel === q.answerBool;
    answerText = q.answerBool ? 'O (맞아요)' : 'X (아니에요)';
    $('#q-wrap').querySelectorAll('.opt').forEach(b => {
      const v = b.dataset.v === 'true';
      if(v === q.answerBool) b.classList.add('good');
      else if(v === S.sel && !ok) b.classList.add('bad');
      b.disabled = true;
    });
  }
  else if(q.type === 'wordbank'){
    const made = S.built.map(t=>t.w).join(' ');
    ok = made === q.answer;
    answerText = q.answer;
    $('#wb-line').querySelectorAll('.chip').forEach((b,i) => {
      b.classList.add(q.answer.split(' ')[i] === S.built[i].w ? 'good' : 'bad');
      b.disabled = true;
    });
  }
  else if(q.type === 'order'){
    ok = S.built.join('|') === q.sequence.join('|');
    answerText = q.sequence.join(' → ');
    $('#order-area').querySelectorAll('.chip').forEach((b,i) => {
      b.classList.add(q.sequence[i] === S.built[i] ? 'good' : 'bad');
      b.disabled = true;
    });
  }
  resolveAnswer(ok, ok ? null : answerText);
}

function resolveAnswer(ok, answerText, meta){
  S.locked = true;
  const q = S.cur.q;
  const m = meta || {};
  if(ok){
    play('good');
    if(S.cur.first) S.firstCorrect++;
    S.xp += S.cur.first ? 10 : 5;
    S.solved++;
    updatePbar();
  } else {
    play('bad');
    if(q.type === 'match'){
      S.xp += 5; S.solved++; updatePbar();
    } else {
      S.hearts--; renderHearts();
      S.queue.push({ q, first:false });
    }
  }
  // 정답이면 목표 문장을 한 번 더 들려준다 (스픽 스타일 각인)
  const tgt = targetSentence(q);
  if(ok && tgt && !m.speak && me().autoplay !== false) setTimeout(()=>say(tgt), 260);
  showFeedback(ok, answerText, q.explanation, m);
}

function showFeedback(ok, answerText, expl, meta){
  const m = meta || {};
  const q = S.cur.q;
  const fb = $('#feedback');
  let title;
  if(m.skipped) title = '넘어갈게요';
  else if(ok) title = (m.speak && typeof m.ratio === 'number') ? speakPraise(m.ratio) : PRAISE[Math.floor(Math.random()*PRAISE.length)];
  else title = m.speak ? '조금 더 또렷하게!' : '아쉬워요!';
  fb.className = 'feedback ' + (ok ? 'good-fb' : 'bad-fb');
  const tgt = targetSentence(q);
  // 말하기는 "정답 문장" 대신 단어별로 어디가 전달됐는지 보여 준다
  const speakBreakdown = (m.speak && m.hits)
    ? '<p class="fb-heard">' + words(m.target).map((w,i)=>'<span class="'+(m.hits[i]?'hit':'miss')+'">'+esc(w)+'</span>').join(' ')
      + ' <span class="score-ring">'+Math.round(m.ratio*100)+'%</span></p>'
    : '';
  fb.innerHTML =
    '<div class="fb-head"><div class="fb-icon">'+(ok?IC.check:IC.cross)+'</div><div class="fb-title">'+title+'</div></div>'
    + speakBreakdown
    + (answerText && !ok ? '<p class="fb-answer">정답: '+esc(answerText)+'</p>' : '')
    + (expl ? '<p class="fb-expl">'+esc(expl)+'</p>' : '')
    + (tgt && TTS ? '<p class="fb-answer">'+esc(tgt)+' <button class="tts-mini" id="fb-say" aria-label="다시 듣기">'+IC.speaker+'</button></p>' : '')
    + '<button class="btn '+(ok?'good':'bad')+'" id="btn-continue">계속하기</button>';
  $('#check-bar').style.display = 'none';
  requestAnimationFrame(()=>fb.classList.add('show'));
  const sayBtn = $('#fb-say');
  if(sayBtn) sayBtn.addEventListener('click', ()=>say(tgt));
  $('#btn-continue').addEventListener('click', ()=>{
    fb.classList.remove('show');
    stopSay();
    setTimeout(()=>{
      if(!S) return;
      if(S.hearts <= 0){ finishLesson(false); return; }
      if(S.queue.length === 0){ finishLesson(true); return; }
      nextQuestion();
    }, 180);
  }, { once:true });
}

/* ================= 결과 ================= */
function finishLesson(success){
  stopSay(); stopRecognition();
  const u = me();
  const acc = Math.round(S.firstCorrect / S.total * 100);
  const spk = S.speakScores.length
    ? Math.round(S.speakScores.reduce((a,b)=>a+b,0) / S.speakScores.length * 100) : null;
  let body = '';
  if(success){
    const stars = acc >= 90 ? 3 : acc >= 70 ? 2 : 1;
    const perfect = S.firstCorrect === S.total;
    let earned = S.xp + (perfect ? 20 : 0);
    const t = todayStr();
    if(u.lastDay !== t){
      u.streak = (u.lastDay === yesterdayStr()) ? (u.streak||0) + 1 : 1;
      u.lastDay = t;
    }
    u.xp = (u.xp||0) + earned;
    const prev = u.done[S.lesson.id];
    u.done[S.lesson.id] = {
      stars: Math.max(prev ? prev.stars : 0, stars),
      best: Math.max(prev ? prev.best : 0, acc),
    };
    saveStore();
    play('win');
    body =
      '<div class="result-emblem win">'+IC.crown+'</div>'
      + '<h2 class="result-title">'+(S.review ? '복습 완료!' : '레슨 완료!')+'</h2>'
      + '<p class="result-sub">'+esc(S.lesson.title)+(perfect ? ' · 완벽한 풀이!' : '')+'</p>'
      + '<div class="result-stars">'+[1,2,3].map(k=>IC.star.replace('class="icon"','class="'+(k<=stars?'':'dim')+'"')).join('')+'</div>'
      + '<div class="result-stats">'
      + '<div class="rstat v-xp"><div class="lab">획득 XP</div><div class="val">'+IC.bolt+'+'+earned+'</div></div>'
      + '<div class="rstat v-acc"><div class="lab">'+(spk === null ? '정답률' : '발음')+'</div><div class="val">'+IC.target+(spk === null ? acc : spk)+'%</div></div>'
      + '<div class="rstat v-streak"><div class="lab">연속 학습</div><div class="val">'+IC.flame+displayStreak(u)+'일</div></div>'
      + '</div>'
      + '<div class="result-actions"><button class="btn primary" id="btn-go-home">계속하기</button></div>';
  } else {
    body =
      '<div class="result-emblem lose">'+IC.heart+'</div>'
      + '<h2 class="result-title">하트를 모두 사용했어요</h2>'
      + '<p class="result-sub">괜찮아요. 다시 도전하면 더 잘할 수 있을 거예요!</p>'
      + '<div class="result-actions">'
      + '<button class="btn primary" id="btn-retry">다시 도전</button>'
      + '<button class="btn ghost" id="btn-go-home">홈으로</button></div>';
  }
  $('#result-body').innerHTML = body;
  const gi = S.gi, review = S.review;
  S = null;
  show('s-result');
  if(success) burstConfetti();
  const homeBtn = $('#btn-go-home');
  if(homeBtn) homeBtn.addEventListener('click', ()=>{ renderHome(); show('s-home'); });
  const retryBtn = $('#btn-retry');
  if(retryBtn) retryBtn.addEventListener('click', ()=>startLesson(gi, review));
}

/* ================= 컨페티 ================= */
function burstConfetti(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti');
  const rect = cv.parentElement.getBoundingClientRect();
  cv.width = rect.width; cv.height = rect.height;
  const ctx = cv.getContext('2d');
  const colors = ['#F2B01E','#2FC2B1','#EF5B6B','#0E8F84','#7CC6FE'];
  const parts = Array.from({length:90}, ()=>({
    x: cv.width/2 + (Math.random()-.5)*80,
    y: cv.height*0.35,
    vx: (Math.random()-.5)*9,
    vy: -Math.random()*10 - 4,
    s: Math.random()*7+4,
    c: colors[Math.floor(Math.random()*colors.length)],
    r: Math.random()*Math.PI,
    vr: (Math.random()-.5)*.3,
  }));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=.35; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);
      ctx.restore();
    });
    if(++frames < 110) requestAnimationFrame(tick);
    else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* ================= 종료 확인 ================= */
function confirmQuit(){
  const veil = openModal(
    '<h3>레슨을 그만둘까요?</h3><p class="msub">지금 나가면 이번 레슨 진행 상황은 저장되지 않아요.</p>'
    + '<div class="modal-actions">'
    + '<button class="btn primary" id="btn-stay">계속 학습하기</button>'
    + '<button class="btn ghost" id="btn-leave" style="color:var(--coral)">그만두기</button></div>'
  );
  veil.querySelector('#btn-stay').addEventListener('click', closeModal);
  veil.querySelector('#btn-leave').addEventListener('click', ()=>{
    closeModal(); S = null;
    stopSay(); stopRecognition();
    $('#feedback').classList.remove('show');
    renderHome(); show('s-home');
  });
}

/* ================= 초기화 ================= */
$('#btn-start').addEventListener('click', tryStart);
$('#name-input').addEventListener('keydown', e => { if(e.key === 'Enter') tryStart(); });
$('#btn-profile').addEventListener('click', openProfile);
$('#btn-check').addEventListener('click', ()=>{ if(S && !S.locked) checkAnswer(); });
$('#btn-quit').addEventListener('click', confirmQuit);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ stopSay(); stopRecognition(); } });

if(!TRACKS.length){
  document.body.innerHTML = '<p style="padding:40px;text-align:center;font-weight:800">'
    + '커리큘럼 데이터가 없습니다. <code>node build.mjs</code> 를 실행해 주세요.</p>';
} else if(store.last && store.users[store.last]){
  userName = store.last;
  setTrack(store.users[userName].track || TRACKS[0].id);
  renderHome(); show('s-home');
} else {
  setTrack(TRACKS[0].id);
  renderOnboard();
}
</script>

</html>
